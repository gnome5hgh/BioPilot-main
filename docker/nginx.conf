# BioPilot 前端托管：静态 dist + /api 反代 SpringBoot（SSE 与 WebSocket 同一条）。
server {
    listen 80;

    # 与 SpringBoot 的上传上限对齐（210MB）：nginx 默认 1m 会让正常 PDF 直接 413，
    # 请求根本到不了后端。
    client_max_body_size 210m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
    location /api/ {
        # 不剥前缀：服务端路由本身就是 /api/v1/**
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        # WebSocket 升级（终端）与 SSE 长连接都不设应用层超时
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # SSE 必须关闭缓冲/分块聚合，否则小帧被压住，前端表现为「不流式」；
        # X-Accel-Buffering 是给上游主动关闭缓冲的兜底开关。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
