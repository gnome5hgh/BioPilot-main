# biopilot/engine/intent/data/taxonomy.yaml —— 意图类别知识库（随包发布的生产资产）
#
# 每个类别给一段**判定口径**加若干**示例句**：两者一起构成判定模型看到的 criteria。
# 描述要写清「是什么 / 不包什么」——类别之间的边界是判定的全部难点，只写正面定义
# 等于把边界留给模型去猜。
#
# 示例句与 rules.yaml 里的高精度模式逐字不重复——同一句话既当示例又当规则会让两边
# 都失去意义。
#
# 领域意图各对应一个可派发的领域 agent，其余类别不派发领域角色；这张对应关系由
# 锁定测试守着，不在本文件里维护清单。类别枚举以代码里的 `IntentType` 为准。

classes:
  paper:
    description: >-
      论文事务：检索、筛选、下载论文，或针对**某一篇指定论文**读正文、分析图表、
      给判断；也包括删除本轮下载/已登记为分析产物的 PDF。判定要点是「要动论文这个
      对象本身」，且这是 agent 能直接执行的领域任务（不是网页端管理）。
      不包含：把论文写进笔记（note）、让论文能被我检索（index 或 help 的网页收录）、
      就已有材料回答一般性知识问题（question）、论文库与引用库的网页管理（help）。
    examples:
      - 下载最新论文
      - 搜索 circRNA 文献
      - 找一篇异构图神经网络的论文
      - 查一下药物靶点预测的最新进展
      - 帮我搜索关于 miRNA 的综述
      - 检索链路预测的相关文献
      - 这篇论文的方法有什么缺陷
      - 帮我精读一下这篇论文，指出实验设计的问题
      - 分析一下这个方法的优缺点
      - 删掉这篇下载错的论文

  note:
    description: >-
      笔记事务：产出、修订或删除一篇平台文档形式的笔记——基于指定 PDF 撰写结构化
      笔记、把某篇论文的要点整理成笔记、改既有笔记、删掉写错的笔记。判定要点是
      「要产出/修改/删除笔记文档」。
      不包含：只读笔记内容回答问题（question）、读论文原文（paper）、
      研究选题产物（research）。
    examples:
      - 把这篇论文整理成笔记
      - 写一份笔记
      - 给这篇文章生成一个阅读摘要
      - 帮我总结一下这篇论文的要点
      - 为这篇 circRNA 论文做一份笔记
      - 总结这篇论文并保存成笔记
      - 删掉这篇笔记
      - 笔记写错了，删掉重来

  research:
    description: >-
      选题事务：从已收录语料出发给出研究方向、研究空白、候选课题或可执行的研究计划，
      也包括修订与删除这些选题产物（survey/gaps/idea 卡/研究计划）。判定要点是
      「要一个方向或计划，而不是一个事实或一份材料」。
      不包含：找或读具体论文（paper）、把某篇论文写成笔记（note）、
      单纯问学术知识（question）。
    examples:
      - 帮我找一个研究方向
      - 帮我看看我能做什么研究
      - 我读过的论文能支撑什么研究
      - 帮我看看读过的文献里有哪些研究空白
      - 把我读过的论文变成研究计划
      - 这几个方向哪个更值得做
      - 帮我写一份研究计划
      - 删掉这个研究计划

  bioinformatics:
    description: >-
      生信分析与数据执行事务：对**已就位的数据文件**做检查、统计检验、差异表达、
      富集、生存分析、单细胞 QC/降维/聚类、可视化与报告，或让系统在隔离沙箱里跑
      一段 Python / shell 命令得到真实结果。判定要点是「要处理数据或执行代码/命令，
      而且要的是跑出来的结果」。
      不包含：与数据无关的通用软件开发/代写代码（out_of_scope）、读论文（paper）、
      检索文献（paper）、整理成论文笔记（note）。
    examples:
      - 帮我做这组数据的差异表达分析
      - 用 DESeq2 分析这个表达矩阵
      - 这批单细胞数据先做 QC 和降维聚类
      - 画一张火山图
      - 帮我做生存分析，画 KM 曲线
      - 跑一段 Python 算一下这个表的统计量
      - 用 shell 把这些文件按样本重命名
      - 对这个数据做富集分析
      - 分析一下这批样本的批次效应
      - 把这次分析结果整理成报告

  index:
    description: >-
      语料索引体检：查知识库的索引状态、收录进度、失败原因，或解释「为什么某篇论文
      搜不到」。判定要点是「诊断索引现状」，不是执行收录动作。
      不包含：把论文加入知识库、重建/重试索引、从知识库移除——这些是网页端操作
      （help）；在语料里找材料回答问题（question）。
    examples:
      - 索引状态怎么样
      - 哪些论文还没建好索引
      - 索引好像少了几篇
      - 为什么我的论文搜不到
      - 帮我看看知识库里收录了多少篇
      - 上次导入的论文索引完成了吗
      - 索引体检一下
      - 有没有索引失败的论文

  memory:
    description: >-
      长期记忆事务：查系统记住的关于用户自己与用户研究的信息（画像、研究方向、
      项目背景、偏好、此前沉淀的文献要点），或用户**陈述**自己的研究方向、专业、
      偏好、课题（这是要被记住的信息，不是要系统执行的任务）。判定要点是
      「关于用户自己或它的长期记忆」。
      不包含：问学术知识（question）、平台侧的论文库/列表（help）、
      让系统执行具体任务（领域类别）。
    examples:
      - 我读过哪些论文
      - 我之前保存过哪些文献要点
      - 我的研究方向是图神经网络
      - 我主要做单细胞测序
      - 记住我习惯用 Python 做分析
      - 我之前的课题是什么
      - 你记得我的研究背景吗
      - 我打算研究 miRNA 与疾病的关联

  question:
    description: >-
      即问即答：就学术内容问一个具体问题、要一个解释或判断（机制是什么、这个方法
      怎么做、这个公式什么意思、这个结论可不可靠），依据在上下文、记忆块或已收录
      语料里。判定要点是「要一个答案」。
      不包含：针对**某一篇指定论文**的问题——那要先把原文读出来（paper）；要一份
      笔记（note）、要一个新方向（research）、要跑数据分析（bioinformatics）、
      问自己的历史或画像（memory）、问平台怎么用（help）。
    examples:
      - circRNA 的机制是什么
      - 解释一下这个公式
      - 异构图神经网络是怎么工作的
      - 链路预测用的是什么方法
      - 图对比学习的核心思想是什么
      - 什么是 miRNA 海绵机制
      - 这个损失函数代表什么意思
      - 为什么用异构图而不是同构图
      - 我知识库里关于 circRNA 讲了什么

  chitchat:
    description: >-
      寒暄应答：打招呼、道谢、告别、随口闲聊，整句不构成任何学术请求。
      不包含：问系统能做什么（help）、对系统表现的反馈（feedback）、越界的代办请求
      （out_of_scope）。
    examples:
      - 你好啊
      - 早上好
      - 晚上好
      - 多谢啦
      - 辛苦了
      - 拜拜啦
      - 你是谁呀
      - 在吗

  out_of_scope:
    description: >-
      非本系统的任务，两种情形都要归到这一类：① **明确越界**——订外卖、查天气、
      代写论文、与数据分析无关的通用软件开发这类本系统不做的代办；② **看不出用户
      要做什么**——信息不足以归入任何一类。系统对前者明确拒绝并说明能力边界，对后者
      先向用户问清，不要直接拒。
      不包含：平台网页功能与用法（help）、闲聊（chitchat）。
    examples:
      - 帮我订个外卖
      - 你能帮我查天气吗
      - 帮我订一张机票
      - 你能帮我写一封邮件吗
      - 帮我代写论文
      - 帮我写个网站
      - 帮我翻译一段话
      - 帮我处理一下那篇

  help:
    description: >-
      系统能力与平台操作指引：问系统能做什么、怎么用、有哪些功能；或让系统做
      **网页端完成**的平台操作——论文库收录与移出、引用库维护与 bib 导出、文件上传与
      管理、项目管理、定时任务、技能与设置、终端面板。判定要点是「系统支持，但由
      平台网页完成，agent 不执行」。
      不包含：agent 能直接执行的领域任务（paper/note/research/bioinformatics/index）、
      本系统不做的越界代办（out_of_scope）。
    examples:
      - 你能干什么
      - 怎么用
      - 你可以帮我做什么
      - 介绍一下你的功能
      - 有什么功能
      - 我不太会用
      - 你会哪些操作
      - 你可以提供哪些服务
      - 把这批论文加入知识库
      - 重建一下知识库索引
      - 把这篇论文加入引用库
      - 导出我的引用库为 bib
      - 帮我建一个每天早上自动检索论文的任务
      - 我想上传一篇论文
      - 打开终端
      - 修改一下模型配置

  feedback:
    description: >-
      对系统表现的评价与纠正：说刚才的回答、检索结果、生成的笔记、分析结果或建议
      不对、不好、漏了重点，或指出上次说错了。判定要点是「用户在评价系统已经做过
      的事」。
      不包含：提出一个新的学术请求、闲聊（chitchat）。
    examples:
      - 这个回答不对
      - 这篇论文不是我要的
      - 你刚才说错了
      - 这个结果不太对
      - 上次那个回答有问题
      - 这篇笔记写得不好
      - 搜索结果不对
      - 这个分析结果不对
      - 我不满意这个回答
