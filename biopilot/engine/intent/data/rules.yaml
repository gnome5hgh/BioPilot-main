# biopilot/engine/intent/data/rules.yaml —— 规则层的**高精度**模式（随包发布的生产资产）
#
# 规则层在判定模型之前跑，命中即定类、不命中即放行。它**永不猜测**：只收那些
# 「说了这句话基本不可能是别的意思」的模式。因此这张表天然是窄的——
# 判定模型能处理的开放说法（找论文、问答、选题、平台操作）这里一条都不放，放进去
# 只会制造误命中，而误命中的代价高于多跑一次模型。
#
# 加一条规则前的自检：有没有一句正常的话会被它误吸？举不出反例再加。
# 每条模式都是正则（已做整句锚定或词形约束的地方见 note），必须能被 re.compile 通过。

rules:
  # ── 索引体检：只收「诊断索引现状」的说法 ──
  # 收录、重建、重试、移出都是网页端操作（归 help），这里一条都不收：
  # 那些动作的固定说法会把「重建索引是什么原理」这类问题一起吸进来。
  - intent: index
    pattern: '(索引.{0,6}(状态|进度|体检|情况|不对|对不上|少了|乱了|失败|完成|好了)|索引(失败|报错|异常)|哪些论文.{0,8}(没有|还没|未).{0,4}(索引|收录)|为什么.{0,12}搜不到|知识库.{0,6}(收录了|有多少|状态))'
    note: 指向「索引现状」的诊断，不是收录/重建动作

  # ── 系统能力：固定问法 ──
  # 平台操作（加入知识库/引用库、导出 bib、上传、定时任务、终端、设置）不设规则：
  # 它们的说法与「问原理」高度重叠，交给判定模型更安全。
  - intent: help
    pattern: '^(你(能|会|可以)(干什么|做什么|帮我做什么|提供哪些(帮助|服务|功能)|提供什么(帮助|服务))|有什么功能|有哪些功能|介绍一下你的功能|介绍一下你的能力|怎么用|如何使用|我不太会用|教我.{0,4}(怎么)?用|你会哪些操作)[^。]{0,4}[?？。]?$'
    note: 整句锚定——避免含「怎么用」的普通问题被吸进来（如「这个方法怎么用在小样本上」）

  # ── 长期记忆：只收「我…哪些」与「查我的记忆」两种固定形态 ──
  # 「用户陈述自身信息」（我的研究方向是…）说法太开放，交给判定模型。
  # 阅读记录/未读清单/收藏列表是平台列表，不是记忆块，规则不再收它们。
  - intent: memory
    pattern: '^(我(读过|看过|保存过|做过|记过)哪些.{0,8}|(查看|显示|打开|列出|看下|看一?下).{0,4}(我的)?(记忆|画像|研究记录|文献要点|记忆块))[^。]{0,6}[?？。]?$'
    note: 整句锚定；这只是记忆类的一半——陈述自身信息交给判定模型

  # ── 产出笔记：明确要一份笔记文件 ──
  - intent: note
    pattern: '(整理成笔记|整理成一份笔记|生成(?!的).{0,6}笔记|(写|做|生成)一?份.{0,6}笔记|记成笔记|总结.{0,8}(并)?(保存|存)(成|为).{0,4}笔记)'
    note: >-
      必须是「要产出笔记」的说法；只说「整理一下资料」不在此列。`生成(?!的)` 是挡
      「生成**的**笔记」——那是「已有一份笔记」的名词短语，不是要你去写一份。

  # ── 反馈：评价句式（含主体 + 被评价物 + 否定词）──
  - intent: feedback
    pattern: '((刚才|上次|之前|你).{0,10}(回答|回复|结果|建议|信息|笔记|论文|搜索|讲解).{0,10}(不对|不准确|有误|错了|有问题|不好|太差|漏(掉|了))|((你|系统).{0,6}(说错|讲错|答错|弄错))|(这个|那个|这次的)(回答|结果|回复|建议).{0,6}(不对|不太对|有误|错了|不太好))'
    note: >-
      三支：①「谁做的 + 被评价物 + 否定词」；②「你说错了」这类只带主体的；
      ③「这个回答不对」这类带指示代词的。三支都要求出现否定评价——单说
      「这个不对」不在此列（指代不明，交判定模型）

  # ── 纯寒暄：整句锚定，只收不含任何请求的短句 ──
  - intent: chitchat
    pattern: '^(你好|您好|嗨|hi|hello|哈喽|早上好|上午好|中午好|下午好|晚上好|晚安|在吗|谢谢|谢谢你|多谢|多谢啦|感谢|辛苦了|拜拜|拜拜啦|再见|bye|哈哈|嗯嗯|好的|收到|你是谁呀)[啊呀哦啦呢吧。，,！!~～\s]*$'
    note: 整句锚定——含这些词但另有请求的（如「你好，帮我下载两篇论文」）不在此列
