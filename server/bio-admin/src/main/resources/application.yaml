server:
  port: 8080
spring:
  datasource:
    # 与 Python 侧同一 MySQL 实例（记忆/会话真相源同库，D6）
    url: jdbc:mysql://127.0.0.1:3306/biopilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: "mysql0607"
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 论文 multipart 上传：默认 1MB 会把正常 PDF 全拒掉，上限与适配层侧 200MB 对齐
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  # SSE 长连接不限时：对话流生命周期由两端管理（心跳保活）；容器默认 30s
  # 异步超时会把超过 30 秒的回答拦腰掐断（掐断后写错误体还会二次报错）
  mvc:
    async:
      request-timeout: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.biopilot: info
# 对象存储：与 Python 侧 rag.storage.minio 同一实例/同一 bucket（键前缀区分用途）
biopilot:
  # 内部调用共享 token：Python agent 调 /internal/* 与 Java 调引擎内部端点共用
  internal-token: ${BIOPILOT_INTERNAL_TOKEN:}
  # 默认文献检索源：空库首次启动时种入；compose 内由环境变量改成 paper-search-mcp 服务名
  paper-search:
    url: ${BIOPILOT_PAPER_SEARCH_URL:http://127.0.0.1:8000/mcp}
    enabled: ${BIOPILOT_PAPER_SEARCH_ENABLED:true}
  storage:
    minio:
      endpoint: ${BIOPILOT_MINIO_ENDPOINT:localhost:9000}
      access-key: ${BIOPILOT_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${BIOPILOT_MINIO_SECRET_KEY:minioadmin}
      bucket: ${BIOPILOT_MINIO_BUCKET:biopilot-images}
      secure: ${BIOPILOT_MINIO_SECURE:false}
