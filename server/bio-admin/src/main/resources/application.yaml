server:
  port: 8080
spring:
  datasource:
    # 与 Python 侧同一 MySQL 实例（记忆/会话真相源同库，D6）
    url: jdbc:mysql://127.0.0.1:3306/biopilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 论文 multipart 上传：默认 1MB 会把正常 PDF 全拒掉，上限与适配层侧 200MB 对齐
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  # SSE 长连接不限时：对话流生命周期由两端管理（心跳保活）；容器默认 30s
  # 异步超时会把超过 30 秒的回答拦腰掐断（掐断后写错误体还会二次报错）
  mvc:
    async:
      request-timeout: 0
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.biopilot: info
