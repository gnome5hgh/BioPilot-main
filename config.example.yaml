# BioPilot 配置模板 —— 复制为 config.yaml 使用（config.yaml 被 gitignore，不会提交）
#   cp config.example.yaml config.yaml
#
# 纯覆盖文件：只写「要改的值」，未列出的字段回落代码默认值。所有可调参数的
# 默认值**唯一声明在 biopilot/config.py**（dataclass 字段默认值，含注释）——
# 改默认值只改那里，本模板不重复罗列，避免两处同步。
# 加载顺序：config.py 默认值 ← config.yaml ← BIOPILOT_* 环境变量（后者最高）
# env 名 = BIOPILOT_ + 配置路径大写（rag.storage.uri → BIOPILOT_RAG_STORAGE_URI）；
# agents.timeouts 是自由 dict，仅 YAML 可配。

llm:
  api_key: ""                 # 必填：或 env BIOPILOT_LLM_API_KEY / .env

# 视觉模型（多模态图表分析）：与文本 LLM 同端点/key 的默认已内置，换端点才需要覆盖
vision:
  api_key: ""                 # 留空不崩启动，图表分析调用时降级
  # max_tokens: 8192        # 单次视觉输出上限（默认见 config.py）。视觉模型是推理模型，
  #                          # 思维链长度每次随机，偶尔把预算跑光导致描述为空/截在半句

# 语料库与产物路径（个人绝对路径，文件类工具的数据源；research 留空走默认派生）
corpus:
  note_dir: ""                # 论文笔记根目录
  pdf_dir: ""                 # PDF 根目录
  research_dir: ""

# Java 平台后端：agent 经内部端点调用平台能力（文献检索、文档保存等）。
# 本机开发默认 8080；compose 内由环境变量覆盖为 http://server:8080。
platform:
  base_url: "http://127.0.0.1:8080"
  # 内部调用共享 token；留空回退 BIOPILOT_INTERNAL_TOKEN（与引擎入站校验同一个 secret）
  internal_token: ""
  search_timeout: 90.0
  # 文件上传/下载/PDF 抓取等大流量内部请求的超时（秒）
  transfer_timeout: 120.0

# 意图识别（可选预处理层）：默认关——关掉即整套意图层不挂载，系统走纯 ReAct
# （不装载知识库、不注入 INTENT 块与规则块）。判定层是「规则层（.biopilot/intent/ 的
# 高精度模式）+ 判定服务（结合对话史，尚未接入）」，不再有编码器/路由器配置。
# 判定服务经 Vercel AI Gateway 调决策模型（Decision 模态）。启用意图层要求启动
# 探测通过——网关是托管 API，**账户须先绑定信用卡**，否则一律 403。探测不通过则
# 整套意图层不装配（supervisor 走纯 ReAct）。
# intent:
#   enabled: true
#   history_messages: 6                # 判定时参考的最近对话条数（只取 user/assistant 正文）
#   jev:
#     base_url: https://ai-gateway.vercel.sh/v1
#     api_key: ""                      # 网关 key（vck_ 前缀）；留空则该层不可用
#     model: typesafe-ai/jev           # 同一请求形态下有多家可选，换实现只改这里
#     timeout: 5.0
#     max_retries: 1
#     zero_data_retention: true        # 本层发送的是用户对话史，默认要求零保留
#     only_provider: typesafe-ai       # 钉住提供方；留空则由网关路由

# RAG 检索栈：嵌入/精排端点、检索参数、切块、存储等的默认值见 biopilot/config.py
rag:
  embedding:
    api_key: ""               # 必填才能启用稠密检索/嵌入；留空路由退化纯 BM25
  # storage:
  #   timeout: 5.0            # Milvus 读路径单次 RPC 截止（秒），默认见 config.py。
  #                           # 不设会落回 pymilvus 默认重试（最多 75 次），服务半死时
  #                           # 一次检索白等几十秒——要动这个值先想清楚代价
  #   write_timeout: 60.0     # 写路径截止（秒），批量入库本身耗时故比读路径宽松，默认见 config.py

# 子代理超时（秒，仅 YAML）；默认值见 config.py AgentsConfig（表内每个角色都有值，撞帽即需重估）
# agents:
#   timeouts:
#     note-agent: 900
#     research-agent: 1800
#     citation-agent: 300
#   # 子代理 ReAct 轮数上限（仅 YAML）；未命中角色的用类默认 20。
#   # 单次派发内要串联多阶段的角色（如选题链路）需要更高额度，否则撞上限且无产物。
#   max_turns:
#     research-agent: 45

# 文献检索的 MCP server 由管理员在网页「设置 → 文献检索源」维护（落 MySQL），
# 不在 config.yaml 声明；默认检索源 paper-search-mcp 由 Java 在空库时种入。

# 上下文压缩（YAML / env 均可覆写；默认值以 config/schemas/sections.py 为准）
compaction:
  enabled: true
  # 任一条件满足即触发（OR）：tokens / messages / fraction
  trigger:
    - type: fraction
      value: 0.8
  # 压缩后保留多少近期上下文：messages / tokens / fraction
  keep:
    type: messages
    value: 20
  trim_tokens_to_summarize: 4000   # 送给摘要模型的输入上限
  summary_max_words: 2000          # 单份摘要 token 上限（字段名沿用历史叫法）
  summary_model_name: null         # 摘要专用轻量模型；null = 主模型
  tool_results:
    persist_threshold_chars: 50000 # 单条工具结果超过此字符数时外置
    preview_chars: 2000            # 指针里的预览长度
    bucket: biopilot-tool-results # MinIO 桶（与图表原图分开）
    local_dir: ""                  # 空 = <workspace>/tool-results

# 记忆整合（后台 debounce 队列）
memory:
  consolidation_enabled: true
  debounce_seconds: 30             # 静默窗口：连续多轮合并成一次整合
  max_delay_seconds: 300           # 连续活跃会话的强制整合上限

# 运行时（安全档位与网页终端）
runtime:
  confirm_above: medium          # low=严格 / medium=标准 / high=宽松
  # 网页终端是否允许启动宿主 shell（拥有服务账号的文件与环境访问权）。
  # 只在本人本机使用时开启；共享部署保持 false。
  allow_host_shell: false
