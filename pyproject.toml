[project]
name = "biopilot"
version = "0.1.0"
description = "Academic research workflow assistant — Supervisor + SubAgent + Skills"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "jieba>=0.42",
    "numpy>=1.24",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rank_bm25>=0.2.2",
    "pymysql>=1.1",
    "fastapi>=0.115",
    # multipart 解析：论文上传端点的必需要求
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
    "pymilvus[milvus-lite]>=2.4.2",
    # 图表原图的对象存储客户端（复用依赖栈里的 MinIO；见 rag/storage/image_store.py）
    "minio>=7.2",
    # 配置密钥字段的 AES-GCM 加密（bio_config_secret；见 config/services/store.py）
    "cryptography>=42",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    # 命令解析：把一条命令按语法树拆成逐条命令与 argv（区分 `rm -rf /work` 与
    # `rm -rf /`），供声明了 format="shell_command" 的参数做风险判定。
    # 有预编译 wheel，无需本地编译。
    "tree-sitter>=0.23",
    "tree-sitter-bash>=0.23",
]

[project.scripts]
biopilot = "biopilot.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["biopilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
