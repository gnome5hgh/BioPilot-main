# BioPilot 依赖服务栈：Milvus Standalone（etcd 元数据 + minio 对象存储 + milvus 计算）。
# 启动: docker compose up -d   验证: curl http://localhost:9091/healthz → OK
# 数据卷统一收进 ./.biopilot/（运行时数据根，gitignore 已盖）：Milvus 走 ./.biopilot/infra/milvus/。
# minio 除服务 milvus 外，还供 BioPilot 存图表原图（独立 bucket），故对宿主回环暴露 9000。
# 显式项目名：否则取目录名（改名/克隆后 compose 项目会漂，容器归属与 down/up 对不上）。
name: biopilot
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./.biopilot/infra/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      # 启动初期 TSO 尚未就绪会连续失败：给足宽限期，避免启动即被判 unhealthy
      start_period: 15s

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      # 必须挂 /data（minio 镜像声明的 VOLUME 路径）而非其他路径：挂别的路径会触发
      # Docker 为未覆盖的 /data 自动创建匿名卷（落在 OrbStack volumes 目录的 hash 目录）。
      - ./.biopilot/infra/milvus/minio:/data
    command: minio server /data --console-address ":9001"
    ports:
      # 只绑回环：默认凭证是 minioadmin/minioadmin，绝不能对整个局域网开放。
      # 暴露出来是因为 BioPilot 跑在宿主上，要往这里放图表原图（自有 bucket）。
      - "127.0.0.1:9000:9000"
    restart: unless-stopped
    healthcheck:
      # minio/minio 镜像不带 curl（用 curl 探活会永远 unhealthy），用镜像自带的 mc
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.18
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./.biopilot/infra/milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    restart: unless-stopped
    depends_on:
      # 顺序 + 健康双条件：standalone 必须等 etcd/minio 真正 healthy 才启动
      # （此前列表形式不等健康，etcd TSO 超时导致 standalone 启动即 Exited(1)）
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  mysql:
    container_name: biopilot-mysql
    image: mysql:8.4
    # 记忆/会话真相源（Python 侧 blocks/block_history/messages 与 server 侧业务表同实例）。
    # 只绑回环；root 空密码沿用本栈「回环内默认凭证」的既有口径（minio 同）。
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: biopilot
    volumes:
      - ./.biopilot/infra/mysql:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- 平台三件套（部署形态：--profile full 拉起；dev 只起基建） ----
  webapi:
    build: { context: ., dockerfile: docker/webapi.Dockerfile }
    container_name: biopilot-webapi
    profiles: ["full"]
    # 信任边界：适配层只监听容器内网（不映射宿主端口），SpringBoot 内网调用
    # 携带的 X-User-Id 即真相。Milvus/MinIO 主机名按 compose 服务名覆盖。
    environment:
      BIOPILOT_WEB_HOST: 0.0.0.0
      BIOPILOT_MEMORY_MYSQL_DSN: mysql://root@mysql:3306/biopilot
      BIOPILOT_RAG_STORAGE_URI: http://standalone:19530
      BIOPILOT_RAG_STORAGE_MINIO_ENDPOINT: minio:9000
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.biopilot:/app/.biopilot
      - ./agents:/app/agents:ro
    depends_on:
      mysql:
        condition: service_healthy
      standalone:
        condition: service_healthy

  server:
    build: { context: ., dockerfile: docker/server.Dockerfile }
    container_name: biopilot-server
    profiles: ["full"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/biopilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      BIOPILOT_ADAPTERBASE: http://webapi:8300
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    container_name: biopilot-web
    profiles: ["full"]
    ports:
      - "80:80"
    depends_on:
      - server

networks:
  default:
    name: milvus
